name: Generate Resume PDF

on:
  push:
    branches:
      - main
    paths-ignore:
      - ASSETS/Henry_Ani_CV.pdf
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Generate resume PDF (Puppeteer)
        run: npm run generate-pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Henry_Ani_CV.pdf
          path: ASSETS/Henry_Ani_CV.pdf

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ASSETS/Henry_Ani_CV.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
            exit 0
          fi
          git commit -m "Update generated resume PDF"
          git push origin HEAD:main
