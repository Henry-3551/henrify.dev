name: Validate Resume PDF

on:
  push:
    branches:
      - main
    paths:
      - ASSETS/Henry_Ani_CV_2026.pdf
      - index.html
      - about.html
      - .github/workflows/generate-resume.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify resume PDF
        shell: bash
        run: |
          test -s ASSETS/Henry_Ani_CV_2026.pdf
          echo "Resume PDF exists and is not empty."

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: Henry_Ani_CV_2026.pdf
          path: ASSETS/Henry_Ani_CV_2026.pdf
